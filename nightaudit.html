<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    
    <title>Duty Manager Night Rounds Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media print {
            body { background-color: white !important; color: black !important; font-size: 10px !important; line-height: 1.2 !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .print-border { border: 1px solid #e5e7eb !important; }
            .avoid-break { page-break-inside: avoid; }
            
            input, textarea, select { 
                border: none !important; 
                background: transparent !important;
                resize: none !important;
                padding: 0 !important;
                appearance: none;
            }
            .print\:w-64 { width: 16rem !important; }
            .print\:h-auto { height: auto !important; }
            .print\:max-h-64 { max-height: 16rem !important; }
            .print\:object-contain { object-fit: contain !important; }
            .print\:text-\[10px\] { font-size: 10px !important; }
            * { -webkit-print-color-adjust: exact !important; color-adjust: exact !important; }
        }
        
        body.preview-mode .no-print { display: none !important; }
        body.preview-mode .print-only { display: block !important; }
        body.preview-mode #exit-preview-btn { display: flex !important; }

        .status-btn.selected-compliant { background-color: #0d9488; color: white; border-color: #0d9488; }
        .status-btn.selected-non-compliant { background-color: #ef4444; color: white; border-color: #ef4444; }
        .status-btn.selected-na { background-color: #64748b; color: white; border-color: #64748b; }
        
        .grid-input { border-bottom: 1px solid #f1f5f9; transition: border-color 0.2s; }
        .grid-input:focus { border-color: #0d9488; outline: none; }

        #photo-lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; cursor:zoom-out; }
        #photo-lightbox.open { display:flex; }
        #photo-lightbox img { max-width:94vw; max-height:94vh; object-fit:contain; border-radius:6px; box-shadow:0 0 60px rgba(0,0,0,0.8); animation:lbIn .15s ease; }
        @keyframes lbIn { from{transform:scale(0.85);opacity:0} to{transform:scale(1);opacity:1} }
        #photo-lightbox-close { position:absolute; top:16px; right:20px; color:#fff; font-size:2rem; cursor:pointer; line-height:1; font-weight:700; }
        @media print { #photo-lightbox { display:none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <button id="exit-preview-btn" onclick="app.togglePreview()" class="fixed bottom-8 right-8 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl font-bold z-50 hidden items-center gap-2">
        <i class="fa-solid fa-eye-slash"></i> Exit Preview
    </button>

    <div id="dashboard-view" class="max-w-6xl mx-auto p-4 sm:p-6">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 mt-4 gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 flex items-center gap-3">
                    <i class="fa-solid fa-moon text-teal-600"></i>
                    Night Rounds Audit
                </h1>
                <p class="text-sm text-slate-500 mt-1">Duty Manager Operations Checklist</p>
            </div>
            <button onclick="app.createNewReport()" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-3 rounded-xl font-bold w-full sm:w-auto shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> New Audit Report
            </button>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h2 class="font-bold text-slate-700 uppercase tracking-wider text-sm">Recent Night Audits</h2>
            </div>
            <ul id="report-list" class="divide-y divide-slate-100"></ul>
            <div id="empty-state" class="p-10 sm:p-20 text-center text-slate-400 hidden">
                <i class="fa-solid fa-folder-open text-5xl mb-4 opacity-20"></i>
                <p>No audit reports found.</p>
            </div>
        </div>
    </div>

    <div id="editor-view" class="max-w-6xl mx-auto p-3 sm:p-6 hidden print:p-0 print:max-w-none print:block">
        
        <div class="no-print flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 sticky top-4 z-40 gap-4">
            <div class="flex flex-col">
                <button onclick="app.showDashboard()" class="text-slate-500 hover:text-slate-800 flex items-center gap-2 font-bold text-sm transition-colors mb-1 w-fit">
                    <i class="fa-solid fa-chevron-left"></i> Dashboard
                </button>
                <div id="report-size-badge" class="text-[10px] font-black px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 border border-slate-200 uppercase w-fit transition-colors">
                    Storage Used: 0.00 MB
                </div>
            </div>
            <div class="flex flex-col sm:flex-row flex-wrap gap-2 w-full sm:w-auto">
                <button onclick="app.togglePreview()" class="bg-slate-100 hover:bg-teal-50 text-slate-700 px-4 py-2 rounded-lg font-bold flex-1 sm:flex-none flex items-center justify-center gap-2 border border-slate-200 transition-colors">
                    <i class="fa-solid fa-eye"></i> Preview
                </button>
                <button onclick="window.print()" class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg font-bold flex-1 sm:flex-none flex items-center justify-center gap-2 shadow-md transition-colors">
                    <i class="fa-solid fa-file-pdf"></i> Export PDF
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8 mb-6 print-border print:p-2 print:mb-2">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 print:gap-2">
                <div class="sm:col-span-2 lg:col-span-1">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Duty Manager Name</label>
                    <input type="text" id="meta-dmName" placeholder="Enter Name" class="w-full border-b-2 border-slate-100 py-1 focus:border-teal-500 bg-transparent font-bold text-slate-800 no-print" oninput="this.nextElementSibling.textContent = this.value || '---'" onchange="app.updateMeta('dmName', this.value)">
                    <div class="hidden print-only font-bold text-slate-800 py-1 border-b border-slate-100 break-words"></div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Audit Date</label>
                    <input type="date" id="meta-date" class="w-full border-b-2 border-slate-100 py-1 focus:border-teal-500 bg-transparent font-bold text-slate-800 no-print" oninput="this.nextElementSibling.textContent = this.value || '---'" onchange="app.updateMeta('date', this.value)">
                    <div class="hidden print-only font-bold text-slate-800 py-1 border-b border-slate-100 break-words"></div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Audit Time</label>
                    <input type="time" id="meta-time" class="w-full border-b-2 border-slate-100 py-1 focus:border-teal-500 bg-transparent font-bold text-slate-800 no-print" oninput="this.nextElementSibling.textContent = this.value || '---'" onchange="app.updateMeta('time', this.value)">
                    <div class="hidden print-only font-bold text-slate-800 py-1 border-b border-slate-100 break-words"></div>
                </div>
            </div>
        </div>

        <div id="checklist-container" class="space-y-4 sm:space-y-6 print:space-y-2"></div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8 mt-6 sm:mt-8 print-border print:p-2 print:mt-4 avoid-break">
            <h3 class="text-lg font-bold text-slate-900 mb-6 border-b border-slate-100 pb-2">Final Shift Handover</h3>
            
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-2">Summary of Shift & Findings</label>
            <textarea id="meta-summary" rows="4" placeholder="Document any critical incidents..." class="w-full border border-slate-200 rounded-xl p-4 focus:ring-2 focus:ring-teal-500 outline-none no-print transition-shadow mb-4" oninput="document.getElementById('print-meta-summary').textContent = this.value || '---'" onchange="app.updateMeta('summary', this.value)"></textarea>
            <div id="print-meta-summary" class="hidden print-only text-[11px] whitespace-pre-wrap border border-slate-100 p-3 rounded min-h-[3rem] mb-4 bg-slate-50 font-medium"></div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 print:gap-2 mb-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Handover To (Name)</label>
                    <input type="text" id="meta-handoverName" placeholder="Manager Name" class="w-full border-b-2 border-slate-100 py-1 focus:border-teal-500 bg-transparent font-bold text-slate-800 no-print" oninput="this.nextElementSibling.textContent = this.value || '---'" onchange="app.updateMeta('handoverName', this.value)">
                    <div class="hidden print-only font-bold text-slate-800 py-1 border-b border-slate-100 break-words"></div>
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Handover Time</label>
                    <input type="time" id="meta-handoverTime" class="w-full border-b-2 border-slate-100 py-1 focus:border-teal-500 bg-transparent font-bold text-slate-800 no-print" oninput="this.nextElementSibling.textContent = this.value || '---'" onchange="app.updateMeta('handoverTime', this.value)">
                    <div class="hidden print-only font-bold text-slate-800 py-1 border-b border-slate-100 break-words"></div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                <label class="block text-[10px] font-black text-slate-400 uppercase">Handover Evidence Photos</label>
                <button onclick="app.triggerPhotoUpload('handover')" class="no-print bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg font-bold text-xs flex items-center gap-2 w-full sm:w-auto justify-center transition-colors">
                    <i class="fa-solid fa-camera"></i> Attach Photo
                </button>
            </div>
            
            <div id="handover-photos-container" class="flex gap-4 overflow-x-auto pb-2 hide-scrollbar print:flex-wrap print:overflow-visible"></div>
        </div>

        <input type="file" id="item-photo-upload" accept="image/*" multiple class="hidden" onchange="app.handleItemPhotoUpload(event)">
        <input type="file" id="handover-photo-upload" accept="image/*" multiple class="hidden" onchange="app.handleHandoverPhotoUpload(event)">
    </div>

    <div id="photo-lightbox" onclick="this.classList.remove('open')">
        <span id="photo-lightbox-close" onclick="document.getElementById('photo-lightbox').classList.remove('open')">&times;</span>
        <img id="photo-lightbox-img" src="" alt="Photo Evidence">
    </div>

    <script>
        "use strict";

        const dbUtils = {
            dbName: 'NightAuditDB',
            storeName: 'auditData',
            
            init() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.dbName, 1);
                    req.onerror = () => reject(req.error);
                    req.onsuccess = (e) => resolve(e.target.result);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName);
                        }
                    };
                });
            },
            
            async get(key) {
                try {
                    const db = await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(this.storeName, 'readonly');
                        const store = tx.objectStore(this.storeName);
                        const req = store.get(key);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                } catch(e) { return null; }
            },
            
            async set(key, value) {
                try {
                    const db = await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = db.transaction(this.storeName, 'readwrite');
                        const store = tx.objectStore(this.storeName);
                        const req = store.put(value, key);
                        req.onsuccess = () => resolve(true);
                        req.onerror = () => reject(req.error);
                    });
                } catch(e) { return false; }
            }
        };

        function openLightbox(src) {
            document.getElementById('photo-lightbox-img').src = src;
            document.getElementById('photo-lightbox').classList.add('open');
        }

        const AUDIT_QUESTIONS = Object.freeze([
            "[MAIN PORCH] Manning Valet & LP Team.",
            "[MAIN PORCH] Overall Cleanliness.",
            "[MAIN PORCH] Exit Gate Locked.",
            "[LOBBY & RECEPTION] Lobby seating area furniture arrangement.",
            "[LOBBY & RECEPTION] Floor/carpet cleaning condition.",
            "[LOBBY & RECEPTION] Reception desk/Back office cleanliness.",
            "[LOBBY & RECEPTION] Luggage Room: Secured and organized.",
            "[LOBBY & RECEPTION] Public Restroom cleanliness.",
            "[LOBBY & RECEPTION] Lobby Ambience: Lighting, temperature.",
            "[LOBBY & RECEPTION] Any abnormal smell/noise.",
            "[LOBBY & RECEPTION] Was lobby music switched off at 23.00 hrs.",
            "[LOBBY & RECEPTION] VIP Movements check.",
            "[LOBBY & RECEPTION] Check all digital signage.",
            "[LOBBY & RECEPTION] Is the hotel EV car fully charged.",
            "[LOBBY & RECEPTION] Is hotel EV car key handed over to DM.",
            "[LOBBY & RECEPTION] Conduct a floor check of the M-floor lobby.",
            "[SECURITY & LIFE SAFETY] Key Control Audit: check log.",
            "[SECURITY & LIFE SAFETY] Security Control Room: Staff alert & CCTV.",
            "[SECURITY & LIFE SAFETY] Fire Panel: No faults.",
            "[SECURITY & LIFE SAFETY] Entrance & Exit security.",
            "[SECURITY & LIFE SAFETY] Check 1st floor for security breach.",
            "[SECURITY & LIFE SAFETY] Emergency Exits: Clear & lit.",
            "[SECURITY & LIFE SAFETY] Perimeter Check exterior.",
            "[PUBLIC AREAS & HOUSEKEEPING] Elevators: Clean and functioning.",
            "[PUBLIC AREAS & HOUSEKEEPING] Ensure Fitness Centre/SPA are locked.",
            "[POOL AREA] Pool lighting is on.",
            "[POOL AREA] Check for overall cleanliness.",
            "[POOL AREA] Pool area perimeter check.",
            "[FOOD & BEVERAGE] Outlet Security: All locked.",
            "[FOOD & BEVERAGE] Events Lawn: Smoking poles clean.",
            "[FOOD & BEVERAGE] Events Hall setup.",
            "[FOOD & BEVERAGE] IRD: Staff alert, kitchen clean.",
            "[FOOD & BEVERAGE] Spring: Cleanliness & staff.",
            "[GUEST CORRIDORS & FLOORS] Lighting: All corridor lights.",
            "[GUEST CORRIDORS & FLOORS] Noise Levels check.",
            "[GUEST CORRIDORS & FLOORS] Room Service: Corridors clear.",
            "[GUEST CORRIDORS & FLOORS] Housekeeping: No carts left.",
            "[BACK OF HOUSE (BOH)] Samovar: Cleanliness.",
            "[BACK OF HOUSE (BOH)] Locker rooms: Clean, secure.",
            "[BACK OF HOUSE (BOH)] Receiving Area: Locked.",
            "[BACK OF HOUSE (BOH)] Garbage Area: Secure.",
            "[CAR PARKING] Car parking area cleanliness.",
            "[CAR PARKING] Drivers' restroom cleanliness."
        ]);

        const app = {
            reports: [],
            currentReportId: null,
            currentUploadIndex: null,

            async init() {
                try {
                    let stored = await dbUtils.get('nightReportsV1');
                    if (stored) this.reports = stored;
                } catch (e) { console.warn("Storage blocked.", e); }
                this.renderDashboard();
            },

            async saveToLocal() {
                try {
                    const success = await dbUtils.set('nightReportsV1', this.reports);
                    this.updateSizeIndicator();
                    return success;
                } catch (e) { return false; }
            },

            updateSizeIndicator() {
                const reportString = JSON.stringify(this.reports);
                const sizeMB = (reportString.length / (1024 * 1024)).toFixed(2);
                const badge = document.getElementById('report-size-badge');
                if (badge) badge.textContent = `Storage Used: ${sizeMB} MB`;
            },

            showDashboard() {
                document.body.classList.remove('preview-mode');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('editor-view').classList.add('hidden');
                this.renderDashboard();
            },

            createNewReport() {
                const now = new Date();
                const newReport = {
                    id: Date.now().toString(),
                    meta: { 
                        date: now.toISOString().split('T')[0], 
                        time: now.toTimeString().slice(0, 5),
                        dmName: '', 
                        summary: '', 
                        handoverName: '', 
                        handoverTime: ''
                    },
                    handoverPhotos: [],
                    items: {}
                };
                AUDIT_QUESTIONS.forEach((q, idx) => { 
                    newReport.items[idx] = { status: null, remarks: '', photos: [] };
                });
                this.reports.unshift(newReport);
                this.currentReportId = newReport.id;
                this.saveToLocal();
                this.renderEditor();
                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('editor-view').classList.remove('hidden');
            },

            openReport(id) {
                this.currentReportId = id;
                this.renderEditor();
                document.getElementById('dashboard-view').classList.add('hidden');
                document.getElementById('editor-view').classList.remove('hidden');
            },

            deleteReport(id, event) {
                event.stopPropagation();
                if(confirm("Permanently delete this audit?")) {
                    this.reports = this.reports.filter(r => r.id !== id);
                    this.saveToLocal();
                    this.renderDashboard();
                }
            },

            getCurrentReport() { return this.reports.find(r => r.id === this.currentReportId); },

            updateMeta(field, value) {
                const report = this.getCurrentReport();
                if (report) {
                    report.meta[field] = value;
                    if (field === 'summary') {
                        const obsEl = document.getElementById('print-meta-summary');
                        if (obsEl) obsEl.textContent = value || '---';
                    } else {
                        const el = document.getElementById(`meta-${field}`);
                        if(el && el.nextElementSibling && el.nextElementSibling.classList.contains('print-only')) {
                            el.nextElementSibling.textContent = value || '---';
                        }
                    }
                    this.saveToLocal();
                }
            },

            updateItemStatus(index, status) {
                const report = this.getCurrentReport();
                if (report) {
                    report.items[index].status = (report.items[index].status === status) ? null : status;
                    this.saveToLocal();
                    this.renderChecklist();
                }
            },

            updateItemRemarks(index, value) {
                const report = this.getCurrentReport();
                if (report) { report.items[index].remarks = value; this.saveToLocal(); }
            },

            compressImage(file, callback) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const MAX_SIZE = 1200; 
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > MAX_SIZE) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; } }
                        else { if (h > MAX_SIZE) { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; } }
                        
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        const timestamp = new Date().toLocaleString('en-IN');
                        const fontSize = Math.max(18, Math.floor(w * 0.025)); 
                        ctx.font = `${fontSize}px sans-serif`;
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                        ctx.fillRect(0, h - (fontSize * 2.5), w, fontSize * 2.5);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillText(timestamp, 15, h - (fontSize * 0.8));

                        callback(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            triggerPhotoUpload(target) {
                if (target === 'handover') {
                    document.getElementById('handover-photo-upload').click();
                } else {
                    this.currentUploadIndex = target; 
                    document.getElementById('item-photo-upload').click();
                }
            },

            handleItemPhotoUpload(event) {
                const files = Array.from(event.target.files);
                const input = event.target;
                const report = this.getCurrentReport();
                let pending = files.length;
                if (pending === 0) return;
                files.forEach(file => {
                    this.compressImage(file, async (base64) => {
                        pending--;
                        if (!report.items[this.currentUploadIndex].photos) report.items[this.currentUploadIndex].photos = [];
                        report.items[this.currentUploadIndex].photos.push(base64);
                        await this.saveToLocal();
                        this.renderChecklist();
                        if (pending === 0) input.value = '';
                    });
                });
            },

            handleHandoverPhotoUpload(event) {
                const files = Array.from(event.target.files);
                const input = event.target;
                const report = this.getCurrentReport();
                let pending = files.length;
                if (pending === 0) return;
                files.forEach(file => {
                    this.compressImage(file, async (base64) => {
                        pending--;
                        if (!report.handoverPhotos) report.handoverPhotos = [];
                        report.handoverPhotos.push(base64);
                        await this.saveToLocal();
                        this.renderHandoverPhotos();
                        if (pending === 0) input.value = '';
                    });
                });
            },

            removeItemPhoto(itemIdx, photoIdx) {
                this.getCurrentReport().items[itemIdx].photos.splice(photoIdx, 1);
                this.saveToLocal();
                this.renderChecklist();
            },

            removeHandoverPhoto(idx) {
                this.getCurrentReport().handoverPhotos.splice(idx, 1);
                this.saveToLocal();
                this.renderHandoverPhotos();
            },

            togglePreview() { document.body.classList.toggle('preview-mode'); window.scrollTo(0, 0); },

            renderDashboard() {
                const list = document.getElementById('report-list');
                const empty = document.getElementById('empty-state');
                list.innerHTML = '';
                if (!this.reports.length) { empty.classList.remove('hidden'); return; }
                empty.classList.add('hidden');
                this.reports.forEach(r => {
                    const li = document.createElement('li');
                    li.className = "p-5 sm:p-6 hover:bg-slate-50 cursor-pointer flex items-center justify-between group transition-all";
                    li.onclick = () => this.openReport(r.id);
                    li.innerHTML = `
                        <div class="flex items-center gap-3 sm:gap-4">
                            <div class="w-10 h-10 sm:w-12 sm:h-12 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center font-bold text-sm sm:text-base">
                                ${r.meta.date.split('-')[2] || '--'}
                            </div>
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm sm:text-base">${r.meta.dmName || 'New Audit'}</h3>
                                <p class="text-[10px] sm:text-xs text-slate-400 font-bold uppercase tracking-widest">${r.meta.date} • ${r.meta.time || '---'}</p>
                            </div>
                        </div>
                        <button onclick="app.deleteReport('${r.id}', event)" class="text-slate-300 hover:text-red-500 transition-colors p-2"><i class="fa-solid fa-trash-can"></i></button>
                    `;
                    list.appendChild(li);
                });
            },

            renderEditor() {
                const r = this.getCurrentReport();
                ['dmName', 'date', 'time', 'handoverName', 'handoverTime'].forEach(f => {
                    const el = document.getElementById(`meta-${f}`);
                    if (el) {
                        el.value = r.meta[f] || '';
                        if (el.nextElementSibling && el.nextElementSibling.classList.contains('print-only')) el.nextElementSibling.textContent = r.meta[f] || '---';
                    }
                });
                document.getElementById('meta-summary').value = r.meta.summary || '';
                document.getElementById('print-meta-summary').textContent = r.meta.summary || '---';
                this.renderChecklist();
                this.renderHandoverPhotos();
                this.updateSizeIndicator();
            },

            renderHandoverPhotos() {
                const r = this.getCurrentReport();
                const container = document.getElementById('handover-photos-container');
                container.innerHTML = (r.handoverPhotos || []).map((p, i) => `
                    <div class="relative group shrink-0 w-32 h-32 sm:w-48 sm:h-48 rounded-xl border border-slate-200 overflow-hidden shadow-sm print:w-64 print:h-auto print:max-h-64 transition-transform hover:scale-105">
                        <a href="${p}" target="_blank" onclick="event.preventDefault();openLightbox('${p}')" class="block w-full h-full cursor-zoom-in">
                            <img src="${p}" class="w-full h-full object-cover print:object-contain">
                        </a>
                        <button onclick="app.removeHandoverPhoto(${i})" class="no-print absolute top-2 right-2 bg-red-500 hover:bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center shadow-lg opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-xmark text-xs"></i></button>
                    </div>
                `).join('');
            },

            renderChecklist() {
                const r = this.getCurrentReport();
                const container = document.getElementById('checklist-container');
                container.innerHTML = '';
                let currentCat = '';

                AUDIT_QUESTIONS.forEach((q, idx) => {
                    const item = r.items[idx];
                    const catMatch = q.match(/\[(.*?)\]/);
                    const cat = catMatch ? catMatch[1] : '';
                    const question = q.replace(/\[(.*?)\]\s*/, '');

                    if (cat !== currentCat) {
                        const header = document.createElement('div');
                        header.className = "bg-teal-700 text-white px-5 sm:px-6 py-2.5 font-black uppercase tracking-widest text-[10px] rounded-t-xl print:bg-slate-100 print:text-black print:border-b print:rounded-none mt-4 sm:mt-6 shadow-sm";
                        header.textContent = cat;
                        container.appendChild(header);
                        currentCat = cat;
                    }

                    const row = document.createElement('div');
                    row.className = "bg-white border-x border-b border-slate-200 p-4 sm:p-6 hover:bg-slate-50/50 transition-colors avoid-break last:rounded-b-2xl print:p-2 print:border-slate-100";
                    
                    const photos = (item.photos || []).map((p, pi) => `
                        <div class="relative group shrink-0 w-32 h-32 sm:w-48 sm:h-48 border border-slate-200 rounded-lg overflow-hidden shadow-sm print:w-64 print:h-auto print:max-h-64 transition-transform hover:scale-105">
                            <a href="${p}" target="_blank" onclick="event.preventDefault();openLightbox('${p}')" class="block w-full h-full cursor-zoom-in">
                                <img src="${p}" class="w-full h-full object-cover print:object-contain">
                            </a>
                            <button onclick="app.removeItemPhoto(${idx}, ${pi})" class="no-print absolute top-2 right-2 bg-red-500 hover:bg-red-600 text-white w-7 h-7 rounded-full opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center shadow-md"><i class="fa-solid fa-xmark text-xs"></i></button>
                        </div>
                    `).join('');

                    row.innerHTML = `
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
                            <div class="lg:col-span-5 flex flex-col">
                                <div class="flex items-start gap-3">
                                    <span class="text-teal-600 font-black text-xs mt-0.5 print:text-slate-400">${idx+1}.</span>
                                    <p class="text-sm font-bold text-slate-800 print:text-[11px] leading-relaxed">${question}</p>
                                </div>
                            </div>
                            
                            <div class="lg:col-span-4 flex flex-col no-print">
                                <textarea oninput="this.parentElement.nextElementSibling.textContent = this.value || '---'" onchange="app.updateItemRemarks(${idx}, this.value)" class="w-full border border-slate-200 rounded-lg p-3 text-sm focus:ring-1 focus:ring-teal-500 bg-slate-50 outline-none transition-shadow" placeholder="Observations..." rows="2">${item.remarks}</textarea>
                            </div>
                            <div class="hidden print-only text-[11px] text-slate-800 font-medium whitespace-pre-wrap break-words">${item.remarks || '---'}</div>
                            
                            <div class="lg:col-span-3 flex flex-col gap-2 no-print">
                                <div class="flex gap-1 w-full">
                                    <button onclick="app.updateItemStatus(${idx}, 'compliant')" class="status-btn flex-1 py-2 border border-slate-100 rounded-lg text-[10px] font-black transition-all ${item.status === 'compliant' ? 'selected-compliant shadow-md' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}">YES</button>
                                    <button onclick="app.updateItemStatus(${idx}, 'non-compliant')" class="status-btn flex-1 py-2 border border-slate-100 rounded-lg text-[10px] font-black transition-all ${item.status === 'non-compliant' ? 'selected-non-compliant shadow-md' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}">NO</button>
                                    <button onclick="app.updateItemStatus(${idx}, 'na')" class="status-btn flex-1 py-2 border border-slate-100 rounded-lg text-[10px] font-black transition-all ${item.status === 'na' ? 'selected-na shadow-md' : 'bg-slate-50 text-slate-500 hover:bg-slate-100'}">N/A</button>
                                </div>
                                <button onclick="app.triggerPhotoUpload(${idx})" class="text-[10px] font-black bg-slate-50 hover:bg-slate-100 text-slate-600 py-2 rounded-lg border border-slate-200 transition-all uppercase tracking-tighter w-full flex items-center justify-center gap-2"><i class="fa-solid fa-camera"></i> Add Evidence</button>
                            </div>
                            <div class="hidden print-only text-[10px] font-black text-right uppercase pt-1">[${item.status || 'PENDING'}]</div>
                        </div>
                        ${item.photos && item.photos.length > 0 ? `<div class="mt-4 flex gap-4 overflow-x-auto print:flex-wrap print:mt-2 hide-scrollbar">${photos}</div>` : ''}
                    `;
                    container.appendChild(row);
                });
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
