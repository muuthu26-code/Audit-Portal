<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>Check-Out Audit Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .selected-compliant { background-color: #10b981; color: white; }
        .selected-non-compliant { background-color: #f43f5e; color: white; }
        .selected-na { background-color: #64748b; color: white; }
    </style>
</head>
<body class="bg-slate-50 pb-10">
    <div class="max-w-2xl mx-auto p-4" id="app">
        <h1 class="text-2xl font-black mb-6 text-slate-900">Check-Out Audit</h1>
        <div id="checklist-container" class="space-y-4"></div>
    </div>

    <input type="file" id="photo-upload" accept="image/*" multiple class="hidden" onchange="app.handleFiles(event)">

    <script>
        function escapeHTML(str) { return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

        const app = {
            report: JSON.parse(localStorage.getItem('checkout_data')) || { items: Array(10).fill(null).map(() => ({ status: null, remarks: '', photos: [] })) },
            uploadIdx: null,

            save() { localStorage.setItem('checkout_data', JSON.stringify(this.report)); },

            updateItemStatus(idx, status) {
                this.report.items[idx].status = (this.report.items[idx].status === status) ? null : status;
                this.save(); this.render();
            },

            updateItemRemarks(idx, val) { this.report.items[idx].remarks = val; this.save(); },

            triggerUpload(idx) { this.uploadIdx = idx; document.getElementById('photo-upload').click(); },

            async handleFiles(e) {
                const files = e.target.files;
                for (let file of files) {
                    const base64 = await this.compressImage(file);
                    if (!this.report.items[this.uploadIdx].photos) this.report.items[this.uploadIdx].photos = [];
                    this.report.items[this.uploadIdx].photos.push(base64);
                }
                this.save(); this.render();
            },

            compressImage(file) {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const scale = 600 / img.width;
                            canvas.width = 600; canvas.height = img.height * scale;
                            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.5));
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            },

            removePhoto(itemIdx, pIdx) {
                this.report.items[itemIdx].photos.splice(pIdx, 1);
                this.save(); this.render();
            },

            render() {
                const container = document.getElementById('checklist-container');
                container.innerHTML = this.report.items.map((item, idx) => `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <p class="font-bold text-sm mb-3">Audit Item #${idx + 1}</p>
                        <div class="flex gap-2 mb-3">
                            <button onclick="app.updateItemStatus(${idx}, 'compliant')" class="flex-1 py-2 rounded text-[10px] font-bold ${item.status === 'compliant' ? 'selected-compliant' : 'bg-slate-100'}">YES</button>
                            <button onclick="app.updateItemStatus(${idx}, 'non-compliant')" class="flex-1 py-2 rounded text-[10px] font-bold ${item.status === 'non-compliant' ? 'selected-non-compliant' : 'bg-slate-100'}">NO</button>
                            <button onclick="app.updateItemStatus(${idx}, 'na')" class="flex-1 py-2 rounded text-[10px] font-bold ${item.status === 'na' ? 'selected-na' : 'bg-slate-100'}">N/A</button>
                            <button onclick="app.triggerUpload(${idx})" class="px-3 bg-slate-800 text-white rounded"><i class="fa-solid fa-camera"></i></button>
                        </div>
                        <textarea onchange="app.updateItemRemarks(${idx}, this.value)" class="w-full text-xs p-2 border rounded" placeholder="Remarks...">${escapeHTML(item.remarks)}</textarea>
                        <div class="flex gap-2 mt-2 flex-wrap">
                            ${(item.photos || []).map((p, pIdx) => `
                                <div class="relative w-16 h-16"><img src="${p}" class="w-full h-full object-cover rounded">
                                <button onclick="app.removePhoto(${idx}, ${pIdx})" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[8px]">×</button></div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            }
        };
        app.render();
    </script>
</body>
</html>
